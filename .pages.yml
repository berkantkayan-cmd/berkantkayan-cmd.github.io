
media:
  input: media
  output: /media

content:
  - name: publications
    label: Scientific Publications
    type: file
    path: publications.json
    format: json
    list: true
    fields:
      - name: year
        label: Publication year
        type: string
        required: true
      - name: topic
        label: Research area
        type: select
        required: true
        options:
          values:
            - label: Subcritical Water / Separation
              name: water
            - label: Biochar / Carbon
              name: carbon
            - label: Functional Materials
              name: materials
      - name: title
        label: Article title
        type: string
        required: true
      - name: authors
        label: Authors, journal
        type: text
      - name: url
        label: DOI / publication link (https://)
        type: string

  - name: studies
    label: Research Projects / Studies
    type: file
    path: studies.json
    format: json
    list: true
    fields:
      - name: category
        label: Section label
        type: string
      - name: title
        label: Study title
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: linkText
        label: Link caption
        type: string
      - name: linkUrl
        label: 'Link URL or #publications'
        type: string
      - name: note
        label: Note (shown when no link)
        type: text
